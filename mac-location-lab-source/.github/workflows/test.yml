name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 mac_location_lab.py --help
      - run: sh -n scripts/install.sh && sh -n scripts/uninstall.sh
